# Faultline AI Gateway Configuration
# TrueFoundry AI Gateway routing + fallback chain
name: faultline-gateway

providers:
  - name: bedrock-claude
    provider: bedrock
    model: us.anthropic.claude-sonnet-4-6
    region: us-east-1

  - name: bedrock-deepseek-r1
    provider: bedrock
    model: us.deepseek.r1-v1-0
    region: us-east-1

  - name: bedrock-llama-70b
    provider: bedrock
    model: meta.llama3-70b-instruct-v1-0
    region: us-east-1

  - name: bedrock-kimi
    provider: bedrock
    model: moonshotai.kimi-k2.5
    region: us-east-1

  - name: bedrock-glm
    provider: bedrock
    model: zai.glm-5
    region: us-east-1

virtual_keys:
  # Phase 2: deep reasoning — Claude with DeepSeek and Llama fallbacks
  - name: phase2-reasoning
    targets:
      - provider: bedrock-claude
        weight: 100
      - provider: bedrock-deepseek-r1
        weight: 100
      - provider: bedrock-llama-70b
        weight: 100
    retry:
      attempts: 3
      on_status_codes: [429, 503, 500]
      backoff: exponential
    timeout_ms: 30000

  # Phase 1: fast pattern scan — Llama 70B with Kimi and GLM fallbacks
  - name: phase1-scan
    targets:
      - provider: bedrock-llama-70b
        weight: 100
      - provider: bedrock-kimi
        weight: 100
      - provider: bedrock-glm
        weight: 100
    retry:
      attempts: 2
      on_status_codes: [429, 503]
    timeout_ms: 10000

guardrails:
  input:
    - type: pii_detection
      action: redact
    - type: secret_detection
      action: block
      patterns:
        - AWS_SECRET_ACCESS_KEY
        - GITHUB_TOKEN
        - "sk-[a-zA-Z0-9]{32,}"
  output:
    - type: pii_detection
      action: redact

observability:
  log_requests: true
  log_responses: true
  metadata_tags: [pr_number, repo, phase, file_path]
